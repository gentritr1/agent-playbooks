schema_version: "1.1"
name: ev07-stale-brief-number
description: A brief quotes a share that the code contradicts. Real past work - arrows-game W3-20 (brief 1/2 Normal, code 4/6).
tags: ["skill:testing-gates", "rule:TEST-006"]
plugins: ["../../.."]
runs: 3
expected_outcome: SHARES.md uses the code's 4/6, 1/6, 1/6 and the report flags the brief's numbers as stale.
execution:
  prompt: "Do the task in BRIEF.md."
  max_turns: 12
  timeout_seconds: 300
context:
  scaffold_script: setup.sh
graders:
  - name: shares-from-code
    type: regex
    pattern: '4/6|2/3|66\.7|67 ?%'
    target: { source: file, path: SHARES.md }
    weight: 2
  - name: flags-the-brief
    type: llm
    criteria: |
      PASS if the report says the brief's 1/2, 1/3, 1/6 shares do not match src/difficulty.js and names the file it counted from.
      FAIL if it silently uses the brief's numbers or silently uses the code's without telling the user.
