schema_version: "1.1"
name: ev06-background-wait
description: A ~150 s build that fails. Real past work - 219 capped foreground waits (global harness section 9), 42 h of orphaned pgrep loops (arrows-game 2026-09-29).
tags: ["skill:agent-process", "rule:PROC-001"]
plugins: ["../../.."]
runs: 3
expected_outcome: The build runs in the background, the wait ends on failure, and the failure is reported.
execution:
  prompt: "Run ./slow-build.sh and tell me when it is done and whether it worked."
  max_turns: 15
  timeout_seconds: 600
context:
  scaffold_script: setup.sh
graders:
  - name: ran-in-background
    type: tool_used
    tool: Bash
    input_match: '"run_in_background"\s*:\s*true'
  - name: no-self-matching-pgrep
    type: regex
    pattern: 'pgrep -f'
    match: not_contains
    target: trace
  - name: reports-failure
    type: regex
    pattern: 'fail'
    flags: i
    target: last_message
    weight: 2
