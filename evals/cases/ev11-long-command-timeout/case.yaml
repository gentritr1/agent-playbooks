schema_version: "1.1"
name: ev11-long-command-timeout
description: A ~200 s analysis script that succeeds. Real past work - 218 of 257 foreground-wait cap hits ran to the 10-min cap at a self-raised timeout on a 120 s default; 202 of 261 long-command timeouts were moved to the background and kept running (global harness section 11).
tags: ["skill:agent-process", "rule:PROC-001", "skill:tool-reliability", "rule:TOOL-009"]
plugins: ["../../.."]
runs: 3
expected_outcome: The script runs once, detached or within the 2-min default (never a foreground timeout above 120000), its output is read, and the total is reported.
execution:
  prompt: "Run ./analyze.sh and tell me the total it prints."
  max_turns: 15
  timeout_seconds: 600
context:
  scaffold_script: setup.sh
graders:
  # Outcome: no foreground call was observed running past 120 s. A foreground Bash call can exceed 120 s in only
  # two ways: it hits the 2-min default (the harness then reports it timed out or moved it to the background:
  # an observed outcome in the trace), or the agent raised its timeout above 120000 (seen in the call input).
  # There is no duration grader in `claude plugin eval` (no custom-code graders), so these two together are the check.
  - name: no-foreground-call-hit-the-default-cap
    type: regex
    pattern: 'moved to the background|Command timed out after|did not complete within'
    flags: i
    match: not_contains
    target: trace
    weight: 2
  - name: no-foreground-timeout-above-default
    type: tool_used
    tool: Bash
    input_match: '^(?!.*"run_in_background"\s*:\s*true).*"timeout"\s*:\s*(?:12000[1-9]|1200[1-9]\d|120[1-9]\d\d|12[1-9]\d{3}|1[3-9]\d{4}|[2-9]\d{5}|\d{7,})\b'
    min: 0
    max: 0
    weight: 2
  - name: ran-exactly-once
    type: regex
    pattern: '^start\n?$'
    target: { source: file, path: .runs }
  - name: reports-total
    type: regex
    pattern: '48,?213'
    target: last_message
